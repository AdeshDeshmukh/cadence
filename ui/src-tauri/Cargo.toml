[package]
name = "cadence-ui"
version = "0.1.0"
description = "Cadence Desktop UI"
authors = ["Adesh Deshmukh"]
edition = "2021"

[lib]
name = "cadence_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
